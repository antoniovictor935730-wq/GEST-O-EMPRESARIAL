databases:
  - name: erp-db
    plan: free
    databaseName: erp_db
    user: erp_user

services:
  - type: web
    name: erp-api
    env: node
    plan: free
    rootDir: apps/api
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:prod:render
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: erp-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          type: web
          name: erp-web
          property: host

  - type: web
    name: erp-web
    env: node
    plan: free
    rootDir: apps/web
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run preview -- --port $PORT
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        fromService:
          type: web
          name: erp-api
          property: host
